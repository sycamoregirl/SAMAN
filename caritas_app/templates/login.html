{% extends "base.html" %}
{% block hide_user %}{% endblock %}
{% block content %}

<div class="login-container">
    <div style="display:flex;gap:12px;justify-content:center;align-items:center;margin-bottom:8px">
        <img src="{{ url_for('static', filename='logo.png') }}" style="height:50px" alt="Logo" onerror="this.style.display='none'">
        <img src="{{ url_for('static', filename='caritas_logo.png') }}" style="height:50px" alt="C&aacute;ritas" onerror="this.style.display='none'">
    </div>
    <h2 class="login-title">S.A.M.A.N</h2>
    <p class="login-subtitle">Sistema de monitoreo nutricional</p>

    <form method="POST" class="login-form">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="usuario" class="form-input" placeholder="Usuario" required autofocus>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" class="form-input" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn-app btn-primary"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
    </form>
</div>
{% endblock %}
