{% extends "base.html" %}
{% block app_title %}Editar Entrega{% endblock %}
{% block nav_pacientes %}active{% endblock %}
{% block back_url %}{{ url_for('paciente_perfil', id=entrega.paciente_id) }}{% endblock %}
{% block content %}

<div class="card-app">
    <div class="card-body" style="text-align:center;padding:12px 16px">
        <strong>{{ entrega.nombre }} {{ entrega.apellido }}</strong>
    </div>
</div>

<form method="POST">
    <div class="card-app">
        <div class="card-body">
            <div class="form-group">
                <label>Insumo</label>
                <select name="insumo_id" class="form-select" required>
                    {% for i in insumos %}
                    <option value="{{ i.id }}" {% if i.id == entrega.insumo_id %}selected{% endif %}>
                        {{ i.nombre }} (Stock: {{ i.stock_actual }} {{ i.unidad }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" name="cantidad" class="form-input" step="0.1" min="0.1" value="{{ entrega.cantidad }}" required>
            </div>
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" name="fecha" class="form-input" value="{{ entrega.fecha[:10] }}" required>
            </div>
        </div>
    </div>

    <button type="submit" class="btn-app btn-primary">
        <i class="bi bi-check-lg"></i> Guardar cambios
    </button>
</form>
{% endblock %}
